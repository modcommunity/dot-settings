[plugin]

name="dot-settings"
description="Game settings as a bounded document rather than a singleton: declared entries with types and ranges, three scopes (device, account, server), a pluggable store, atomic debounced writes, and a policy saying what a server may clamp and what it may never read. Depends only on dot-core."
author="dot"
version="0.1.0"
script="dot_settings_plugin.gd"
